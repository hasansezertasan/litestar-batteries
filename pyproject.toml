[project]
name = "litestar-batteries"
version = "0.1.0"
description = "Litestar Batteries"
readme = "README.md"
authors = [
    { name = "hasansezertasan", email = "hasansezertasan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = ["litestar>=2,<3"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

# Shipped code (src) stays fully strict. Tests exercise third-party helpers (e.g. Litestar's
# create_test_client) whose broad signatures trip strict "unknown type" reporting, so silence
# just that rule under tests/ — everything else remains strict.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=litestar_batteries --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["litestar_batteries"]
branch = true
